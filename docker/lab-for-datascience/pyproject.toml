[project]
name = "lab-minimum"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "kacky", email = "t_kaki@nextappli.com" }
]
dependencies = [
    "jupyterhub==5.1.0",
    "jupyterlab==4.1.8",
    "jupyter-resource-usage>=1.1.0",
    "jupyterlab-theme-toggler>=1.0.0",
    "jupyter-server-proxy>=4.3.0",
    "nodejs==0.1.1",
    "ray>=2.34.0",
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigquery-storage>=2.25.0",
    "ipywidgets>=8.1.3",
    "tqdm>=4.66.5",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lab_minimum"]
